                    MIPS 体系结构中的寄存器MIPS 结构体系当中定义了 32 个寄存器通用寄存器标志由 $ 符号开头，通常有两种使用的方式：直接使用对应的寄存器的名称，例如 $t0、$t1、$sp 等。直接使用对应的寄存器的编号，例如 $0、$1、$31 等。每个寄存器都有其特定的作用，有相应的规范，如下表所示。寄存器编号助记符用途0zero值总是为 01at（汇编暂存寄存器）一般由汇编器作为临时寄存器使用。我们编写 MIPS 汇编不使用。2 - 3v0 - v1用于存放表达式的值，或函数的整型、指针型的返回值4 - 7a0 - a3用于函数传参。其值在函数调用的过程中不会被保存。若函数参数较多，多出来的部分通常会使用栈进行传递。8 - 15t0 - t7用于存放表达式的值的临时寄存器。其值在函数调用的过程中不会被保存。16 - 23s0 - s7保存寄存器。这些寄存器中的值在经过函数调用之后不会改变。24 - 25t8 - t9用于存放表达式的值的临时寄存器。其值在函数调用的过程中不会被保存。当调用位置无关函数时，25 号寄存器必须存放被调用函数的地址。26 - 27k0 - k1仅被操作系统使用。28gp全局指针和内容指针。29sp栈指针。30fp 或 s8保存寄存器（同 s0 - s7）。也可用作帧指针。31ra函数返回地址。">
