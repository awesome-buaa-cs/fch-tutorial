                    <h3><span style="font-family: Menlo, Monaco, Consolas, monospace;">MIPS 体系结构中的寄存器</span></h3><ul class="list-paddingleft-2"><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">MIPS 结构体系当中定义了 32 个寄存器</span></p></li><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">通用寄存器标志由 $ 符号开头，通常有两种使用的方式：</span></p></li><ul class="list-paddingleft-2" style="list-style-type: square;"><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">直接使用对应的寄存器的名称，例如 $t0、$t1、$sp 等。</span></p></li><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">直接使用对应的寄存器的编号，例如 $0、$1、$31 等。</span></p></li></ul><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">每个寄存器都有其特定的作用，有相应的规范，如下表所示。</span></p><figure><table><thead><tr class="firstRow"><th><span style="font-family: Menlo, Monaco, Consolas, monospace;">寄存器编号</span></th><th><span style="font-family: Menlo, Monaco, Consolas, monospace;">助记符</span></th><th><span style="font-family: Menlo, Monaco, Consolas, monospace;">用途</span></th></tr></thead><tbody><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">0</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">zero</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">值总是为 0</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">1</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">at</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">（汇编暂存寄存器）一般由汇编器作为临时寄存器使用。我们编写 MIPS 汇编不使用。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">2 - 3</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">v0 - v1</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">用于存放表达式的值，或函数的整型、指针型的返回值</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">4 - 7</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">a0 - a3</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">用于函数传参。其值在函数调用的过程中不会被保存。若函数参数较多，多出来的部分通常会使用栈进行传递。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">8 - 15</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">t0 - t7</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">用于存放表达式的值的临时寄存器。其值在函数调用的过程中不会被保存。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">16 - 23</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">s0 - s7</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">保存寄存器。这些寄存器中的值在经过函数调用之后不会改变。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">24 - 25</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">t8 - t9</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">用于存放表达式的值的临时寄存器。其值在函数调用的过程中不会被保存。当调用位置无关函数时，25 号寄存器必须存放被调用函数的地址。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">26 - 27</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">k0 - k1</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">仅被操作系统使用。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">28</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">gp</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">全局指针和内容指针。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">29</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">sp</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">栈指针。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">30</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">fp 或 s8</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">保存寄存器（同 s0 - s7）。也可用作帧指针。</span></td></tr><tr><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">31</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">ra</span></td><td><span style="font-family: Menlo, Monaco, Consolas, monospace;">函数返回地址。</span></td></tr></tbody></table></figure></li></ul><p><br/></p>
