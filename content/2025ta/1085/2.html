<p><span style="font-family: Menlo, Monaco, Consolas, monospace;">汇编语言是使用符号格式表示指令，可直接面向机器内存以及寄存器的程序设计语言。本部分主要学习内容包括：</span></p><ol class=" list-paddingleft-2"><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">以 MIPS 指令系统为例，学习 MIPS 指令集及汇编语言，能够使用 MIPS 汇编语言编写顺序、分支、循环等具有特定功能的结构化汇编程序，最好能掌握函数调用及栈操作等汇编程序设计方法。</span></p></li><li><p><span style="font-family: Menlo, Monaco, Consolas, monospace;">熟练使用 MARS 工具软件，具备 MARS 调试汇编代码的能力，能使用 MARS 模拟 CPU 执行汇编指令，通过观察相应寄存器、存储等部件的变化情况，查看程序是否符合期望。</span></p></li></ol><p><br/></p>
